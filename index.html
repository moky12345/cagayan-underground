    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee {
      display: inline-flex;
      white-space: nowrap;
      animation: marquee 25s linear infinite;
    }
    .animate-marquee:hover {
      animation-play-state: paused;
    }

    /* Sigil Spin & Pulse */
    @keyframes subtlePulse {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(217, 20, 42, 0.4)); }

    /* Cyber border accents */

    }
    .cyber-corner::before, .cyber-corner::after {
      content: '';
      position: absolute;
      width: 6px;
      height: 6px;
      border-color: #D9142A;
      pointer-events: none;
    }
    .cyber-corner::before {
      top: -1px;
      left: -1px;
      border-top: 2px solid #D9142A;
      border-left: 2px solid #D9142A;
    }
    .cyber-corner::after {
      bottom: -1px;
      right: -1px;
      border-bottom: 2px solid #D9142A;
      border-right: 2px solid #D9142A;
    }
  </style>
</head>

          `LOCATION:${event.venue}, ${event.address}`,

                  Zero chemical emulsion required. Print bold, high-contrast graphic emblems onto thrifted tees and canvas patches.
                </p>

                <div className="space-y-4 font-mono text-xs">
                  <div className="p-3 bg-obsidian border border-wire">
                    <span className="text-crimson font-bold block mb-1">STEP 01: STENCIL CUTTING</span>
                    <p className="text-bone-muted">Excise your high-contrast silhouette from wax or tracing paper using an X-Acto blade over a self-healing mat.</p>
                  </div>
                  <div className="p-3 bg-obsidian border border-wire">
                    <span className="text-crimson font-bold block mb-1">STEP 02: INK PULL</span>
                    <p className="text-bone-muted">Fasten stencil under the screen. Pull water-based textile ink at a 45° angle in one clean stroke.</p>
                  </div>
                  <div className="p-3 bg-obsidian border border-wire">
                    <span className="text-crimson font-bold block mb-1">STEP 03: HEAT CURING</span>
                    <p className="text-bone-muted">Dry for 2 hours. Press with hot iron under baking paper for 3 minutes to permanently bond ink into fibers.</p>
                  </div>
                </div>

                <div className="mt-6 pt-4 border-t border-wire flex justify-between items-center">
                  <button 
                    onClick={() => { setDiyModalOpen(false); scrollToSection('arrivals'); }}
                    className="bg-crimson hover:bg-crimson-bright text-white px-6 py-2.5 text-xs font-mono uppercase transition">
                    BROWSE RAW CANVAS PATCHES →
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 8. SUBMIT GIG MODAL */}
          {submitEventModalOpen && (
            <div className="fixed inset-0 z-50 bg-obsidian/90 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-charcoal border border-wire max-w-xl w-full p-6 sm:p-8 relative cyber-corner shadow-2xl">
                <button onClick={() => setSubmitEventModalOpen(false)} className="absolute top-5 right-5 text-silver hover:text-white text-lg">✕</button>

                <h3 className="text-2xl font-sigil font-bold text-white mb-1">SUBMIT YOUR EVENT</h3>
                <p className="text-xs font-mono text-silver-dark mb-6">
                  Submissions enter moderation before publication to the live calendar.
                </p>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const t = e.target;
                  setSubmissions(prev => [{
                    id: `sub-${Date.now()}`,
                    title: t.title.value,
                    venue: t.venue.value,
                    date: t.date.value,
                    price: Number(t.price.value) || 0,
                    status: 'Pending'
                  }, ...prev]);
                  setSubmitEventModalOpen(false);
                  showToast("Event submitted! Awaiting administrator verification.");
                }} className="space-y-4 font-mono text-xs">
                  <div>
                    <label className="block text-silver-dark mb-1 uppercase">EVENT NAME *</label>
                    <input name="title" required className="w-full bg-obsidian border border-wire p-2.5 text-white" placeholder="e.g. STATIC REBELLION VOL. 1" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-silver-dark mb-1 uppercase">DATE *</label>
                      <input name="date" type="date" required className="w-full bg-obsidian border border-wire p-2.5 text-white" />
                    </div>
                    <div>
                      <label className="block text-silver-dark mb-1 uppercase">DOOR PRICE (PHP)</label>
                      <input name="price" defaultValue="150" type="number" className="w-full bg-obsidian border border-wire p-2.5 text-white" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-silver-dark mb-1 uppercase">VENUE & CITY *</label>
                    <input name="venue" required className="w-full bg-obsidian border border-wire p-2.5 text-white" placeholder="e.g. Nazareth Concrete Garage, CDO" />
                  </div>
                  <button type="submit" className="w-full bg-crimson hover:bg-crimson-bright text-white py-3 uppercase font-bold tracking-wider transition cyber-corner shadow-crimson-glow">
                    SUBMIT GIG TO EDITORIAL BOARD
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* 9. LOOKBOOK INSPECTOR MODAL */}
          {lookbookModalItem && (
            <div className="fixed inset-0 z-50 bg-obsidian/90 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-charcoal border border-wire max-w-xl w-full p-6 relative cyber-corner shadow-2xl">
                <button onClick={() => setLookbookModalItem(null)} className="absolute top-5 right-5 text-silver hover:text-white text-lg">✕</button>

                <div className="aspect-[4/3] overflow-hidden mb-4 bg-obsidian">
                  <img src={lookbookModalItem.image} alt={lookbookModalItem.name} className="w-full h-full object-cover" />
                </div>
                <span className="text-[10px] font-mono text-crimson uppercase tracking-widest">{lookbookModalItem.location}</span>
                <h3 className="text-xl font-sigil font-bold text-white mt-0.5">{lookbookModalItem.name}</h3>
                <p className="text-xs font-mono text-silver-dark mt-2 bg-obsidian p-3 border border-wire">
                  <strong>Fit Breakdown:</strong> {lookbookModalItem.fit}
                </p>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mount App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
