    :root {

    /* Chrome Metallic Border Frame */

      border: 1px solid #34343A;
      background: linear-gradient(135deg, rgba(25, 25, 30, 0.7) 0%, rgba(17, 17, 20, 0.95) 100%);
      position: relative;
    }
    .cyber-frame::before {
      content: '';
      position: absolute;
      top: -1px;
      left: -1px;
      width: 8px;
      height: 8px;
      border-top: 2px solid #D41432;
      border-left: 2px solid #D41432;
      pointer-events: none;
    }
    .cyber-frame::after {
      content: '';
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 8px;
      height: 8px;
      border-bottom: 2px solid #D41432;
      border-right: 2px solid #D41432;
      pointer-events: none;
    }

    @keyframes redPulse {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(212, 20, 50, 0.5)); }

    }

    }

    /* Marquee */
    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee {
      display: inline-flex;
      white-space: nowrap;
      animation: marquee 28s linear infinite;
    }
    .animate-marquee:hover {
      animation-play-state: paused;
    }
  </style>

                  <div>
                    <label className="block text-silver mb-1">PRIMARY PRODUCTS *</label>
                    <select className="w-full bg-obsidian border border-wire p-2.5 text-white">
                      <option>Secondhand Curated Denim</option>
                      <option>Studio Reworked Garments</option>
                      <option>Band Merch &amp; DIY Patches</option>
                      <option>Surplus Leather &amp; Footwear</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-silver mb-1">INSTAGRAM / PORTFOLIO LINK *</label>
                    <input required type="url" className="w-full bg-obsidian border border-wire p-2.5 text-white" placeholder="https://instagram.com/..." />
                  </div>
                  <button type="submit" className="w-full bg-crimson hover:bg-crimson-bright text-white py-3 font-bold uppercase tracking-wider transition cyber-frame shadow-crimson-glow">
                    SUBMIT MERCHANT APPLICATION →
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* 3. PRODUCT DETAIL MODAL */}
          {selectedProduct && (
            <div className="fixed inset-0 z-50 bg-obsidian/95 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-charcoal border border-wire max-w-3xl w-full p-6 sm:p-8 relative cyber-frame shadow-2xl max-h-[90vh] overflow-y-auto">
                <button onClick={() => setSelectedProduct(null)} className="absolute top-5 right-5 text-silver hover:text-white text-lg">✕</button>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 items-start">
                  <div className="aspect-[3/4] bg-obsidian border border-wire overflow-hidden">
                    <img src={selectedProduct.image} alt={selectedProduct.title} className="w-full h-full object-cover" />
                  </div>

                  <div className="flex flex-col justify-between h-full">
                    <div>
                      <span className="text-[10px] font-mono text-crimson uppercase tracking-widest block mb-1">
                        MERCHANT: {selectedProduct.merchant}
                      </span>
                      <h3 className="text-2xl font-serif font-bold text-white leading-tight">
                        {selectedProduct.title}
                      </h3>
                      <div className="text-xl font-mono font-bold text-white mt-2 mb-4">
                        ₱{selectedProduct.price.toLocaleString()}
                      </div>

                      <div className="bg-obsidian border border-wire p-3 text-xs font-mono space-y-1 mb-4">
                        <p><strong className="text-white">Size:</strong> {selectedProduct.size}</p>
                        <p><strong className="text-white">Condition:</strong> {selectedProduct.condition}</p>
                        <p><strong className="text-white">Category:</strong> {selectedProduct.category}</p>
                      </div>

                      <p className="text-xs text-silver leading-relaxed mb-6 font-mono">
                        {selectedProduct.desc}
                      </p>
                    </div>

                    <button 
                      onClick={() => { addToCart(selectedProduct); setSelectedProduct(null); }}
                      className="w-full bg-crimson hover:bg-crimson-bright text-white py-3.5 text-xs font-mono font-bold uppercase tracking-wider transition cyber-frame shadow-crimson-glow">
                      ADD TO BAG — ₱{selectedProduct.price.toLocaleString()}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 4. CART & CHECKOUT SLIDE-OUT DRAWER */}
          {cartOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden">
              <div onClick={() => setCartOpen(false)} className="absolute inset-0 bg-obsidian/80 backdrop-blur-sm transition-opacity" />
              <div className="absolute inset-y-0 right-0 max-w-full flex pl-10">
                <div className="w-screen max-w-md bg-charcoal border-l border-wire shadow-2xl flex flex-col">
                  <div className="p-6 border-b border-wire flex justify-between items-center">
                    <div className="flex items-center space-x-2">
                      <MasterSigil className="w-6 h-6 text-crimson" glow={false} />
                      <h3 className="text-lg font-serif font-bold text-white uppercase">RESERVED BAG ({cartCount})</h3>
                    </div>
                    <button onClick={() => setCartOpen(false)} className="text-silver hover:text-white p-2">✕</button>
                  </div>

                  <div className="p-6 flex-1 overflow-y-auto space-y-4 font-mono text-xs">
                    {cart.map(item => (
                      <div key={item.product.id} className="flex space-x-3 bg-obsidian border border-wire p-3">
                        <img src={item.product.image} alt={item.product.title} className="w-16 h-20 object-cover" />
                        <div className="flex-1 flex flex-col justify-between">
                          <div>
                            <strong className="text-white block truncate">{item.product.title}</strong>
                            <span className="text-[10px] text-silver block">Size: {item.product.size}</span>
                          </div>
                          <div className="flex justify-between items-center mt-2">
                            <span className="text-white font-bold">₱{(item.product.price * item.quantity).toLocaleString()}</span>
                            <span className="text-[10px] text-silver">Qty: {item.quantity}</span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>

                  <div className="p-6 border-t border-wire bg-obsidian font-mono text-xs">
                    <div className="flex justify-between mb-4">
                      <span className="text-silver">ESTIMATED TOTAL</span>
                      <span className="font-bold text-white text-base">₱{cartTotal.toLocaleString()}</span>
                    </div>
                    <button 
                      onClick={() => {
                        setCart([]);
                        setCartOpen(false);
                        showToast("Order Dispatched! Check email for tracking.");
                      }}
                      className="w-full bg-crimson hover:bg-crimson-bright text-white py-3.5 font-bold uppercase tracking-wider transition cyber-frame shadow-crimson-glow">
                      CHECKOUT VIA GCASH / MAYA →
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 5. DIY LAB WORKSHOP CLINIC MODAL */}
          {diyLabModal && (
            <div className="fixed inset-0 z-50 bg-obsidian/95 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-charcoal border border-wire max-w-2xl w-full p-6 sm:p-8 relative cyber-frame shadow-2xl max-h-[90vh] overflow-y-auto">
                <button onClick={() => setDiyLabModal(false)} className="absolute top-5 right-5 text-silver hover:text-white text-lg">✕</button>
                <h3 className="text-2xl font-serif font-bold text-white uppercase mb-2">CAGAYAN DIY LAB WORKSHOP</h3>
                <p className="text-xs font-mono text-silver mb-6">
                  Community-run alteration and screenprint clinics hosted in Nazareth and Macasandig.
                </p>

                <div className="space-y-3 font-mono text-xs">
                  <div className="bg-obsidian border border-wire p-4">
                    <span className="text-crimson font-bold block mb-1">CLINIC 01: WATER-BASED SCREENPRINTING</span>
                    <p className="text-silver">Bring unprinted dark/light tees. Free archival water-based textile ink and squeegees provided.</p>
                  </div>
                  <div className="bg-obsidian border border-wire p-4">
                    <span className="text-crimson font-bold block mb-1">CLINIC 02: RAW CANVAS WHIP STITCHING</span>
                    <p className="text-silver">Permanent back patch application technique using waxed dental floss and upholstery needles.</p>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 6. ADMIN & MERCHANT DASHBOARD MODAL */}
          {dashboardModal && (
            <div className="fixed inset-0 z-50 bg-obsidian/95 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-charcoal border border-wire max-w-4xl w-full p-6 sm:p-8 relative cyber-frame shadow-2xl">
                <button onClick={() => setDashboardModal(false)} className="absolute top-5 right-5 text-silver hover:text-white text-lg">✕</button>
                <div className="flex items-center space-x-2 text-xs font-mono text-crimson mb-2">
                  <MasterSigil className="w-5 h-5 text-crimson" glow={false} />
                  <span>INTERNAL CONTROL CENTER</span>
                </div>
                <h3 className="text-2xl font-serif font-bold text-white uppercase mb-6">ADMIN &amp; MERCHANT PORTAL</h3>
                
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 font-mono">
                  <div className="bg-obsidian border border-wire p-4">
                    <span className="text-[10px] text-silver block">TOTAL ORDERS</span>
                    <strong className="text-2xl text-white block mt-1">124</strong>
                  </div>
                  <div className="bg-obsidian border border-wire p-4">
                    <span className="text-[10px] text-silver block">TOTAL REVENUE</span>
                    <strong className="text-2xl text-crimson block mt-1">₱62,480</strong>
                  </div>
                  <div className="bg-obsidian border border-wire p-4">
                    <span className="text-[10px] text-silver block">MERCHANTS</span>
                    <strong className="text-2xl text-white block mt-1">8 Verified</strong>
                  </div>
                  <div className="bg-obsidian border border-wire p-4">
                    <span className="text-[10px] text-silver block">COMMUNITY GIGS</span>
                    <strong className="text-2xl text-white block mt-1">12 Active</strong>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 7. ALL PRODUCTS CATALOG MODAL */}
          {allProductsModal && (
            <div className="fixed inset-0 z-50 bg-obsidian/95 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-charcoal border border-wire max-w-5xl w-full max-h-[90vh] overflow-y-auto p-6 relative cyber-frame shadow-2xl">
                <button onClick={() => setAllProductsModal(false)} className="absolute top-5 right-5 text-silver hover:text-white text-lg">✕</button>
                <h3 className="text-2xl font-serif font-bold text-white uppercase mb-6">ALL MARKETPLACE GARMENTS</h3>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                  {INITIAL_PRODUCTS.map(p => (
                    <div 
                      key={p.id}
                      onClick={() => { setSelectedProduct(p); setAllProductsModal(false); }}
                      className="cursor-pointer bg-obsidian border border-wire hover:border-crimson p-3 transition">
                      <div className="aspect-[3/4] overflow-hidden mb-2">
                        <img src={p.image} alt={p.title} className="w-full h-full object-cover" />
                      </div>
                      <h4 className="text-xs font-bold text-white truncate">{p.title}</h4>
                      <div className="flex justify-between items-center text-xs font-mono mt-1">
                        <span className="text-silver">{p.size}</span>
                        <strong className="text-white">₱{p.price}</strong>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mount Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
