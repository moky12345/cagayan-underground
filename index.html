    // --- MAIN APP COMPONENT ---
    function App() {
      // Navigation state
      const [route, setRoute] = useState('events'); // 'home', 'events', 'event-detail', 'bands', 'calendar', 'archive', 'submit', 'shop', 'admin'
      const [currentSlug, setCurrentSlug] = useState('noise-disruption-vol-4');
      const [isAdmin, setIsAdmin] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      // Data state
      const [events, setEvents] = useState(() => {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          return stored ? JSON.parse(stored) : INITIAL_EVENTS;
        } catch {
          return INITIAL_EVENTS;
        }
      });

      const [submissions, setSubmissions] = useState(() => {
        try {
          const stored = localStorage.getItem(SUBS_KEY);
          return stored ? JSON.parse(stored) : [];
        } catch {
          return [];
        }
      });

      const [savedIds, setSavedIds] = useState(() => {
        try {
          const stored = localStorage.getItem(SAVED_KEY);
          return stored ? JSON.parse(stored) : [];
        } catch {
          return [];
        }
      });

      // Filter state
      const [selectedGenre, setSelectedGenre] = useState('All');
      const [timeFilter, setTimeFilter] = useState('all'); // 'all', 'upcoming', 'this_week', 'this_month', 'past'
      const [searchQuery, setSearchQuery] = useState('');
      const [calendarView, setCalendarView] = useState('calendar'); // 'calendar' or 'list'
      const [archiveYear, setArchiveYear] = useState('All');

      // Sync state with storage
      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
      }, [events]);

      useEffect(() => {
        localStorage.setItem(SUBS_KEY, JSON.stringify(submissions));
      }, [submissions]);

      useEffect(() => {
        localStorage.setItem(SAVED_KEY, JSON.stringify(savedIds));
      }, [savedIds]);

      // URL Hash listener for browser back/forward and deep linking
      useEffect(() => {
        const handleHash = () => {
          const hash = window.location.hash.replace('#', '') || 'events';
          if (hash.startsWith('events/')) {
            const slug = hash.replace('events/', '');
            setCurrentSlug(slug);
            setRoute('event-detail');
          } else if (['home', 'events', 'bands', 'calendar', 'archive', 'submit', 'shop', 'admin'].includes(hash)) {
            setRoute(hash);
          } else {
            setRoute('events');
          }
        };

        window.addEventListener('hashchange', handleHash);
        handleHash();
        return () => window.removeEventListener('hashchange', handleHash);
      }, []);

      const navigateTo = (newRoute, slug = null) => {
        if (slug) {
          window.location.hash = `events/${slug}`;
        } else {
          window.location.hash = newRoute;
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      const toggleSave = (id, e) => {
        if (e) e.stopPropagation();
        setSavedIds(prev => {
          const exists = prev.includes(id);
          const next = exists ? prev.filter(x => x !== id) : [...prev, id];
          showToast(exists ? "Removed from your gig booklet" : "Stamped to your gig booklet!");
          return next;
        });
      };

      // Filter logic
      const filteredEvents = useMemo(() => {
        const now = new Date();
        const startOfWeek = new Date(now);
        startOfWeek.setDate(now.getDate() - now.getDay());
        const endOfWeek = new Date(startOfWeek);
        endOfWeek.setDate(startOfWeek.getDate() + 7);
        const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0);

        return events.filter(e => {
          const eventDate = new Date(e.start_time);
          
          // Time filter
          if (timeFilter === 'upcoming' && (eventDate < now || e.status === 'completed')) return false;
          if (timeFilter === 'this_week' && (eventDate < now || eventDate > endOfWeek || e.status === 'completed')) return false;
          if (timeFilter === 'this_month' && (eventDate < now || eventDate > endOfMonth || e.status === 'completed')) return false;
          if (timeFilter === 'past' && e.status !== 'completed' && eventDate >= now) return false;

          // Genre filter
          if (selectedGenre !== 'All') {
            if (!e.genre_tags.some(g => g.toLowerCase() === selectedGenre.toLowerCase())) return false;
          }

          // Search query
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchTitle = e.title.toLowerCase().includes(q);
            const matchVenue = e.venue_name.toLowerCase().includes(q);
            const matchCity = e.city.toLowerCase().includes(q);
            const matchOrganizer = (e.organizer_name_override || '').toLowerCase().includes(q);
            const matchGenre = e.genre_tags.some(g => g.toLowerCase().includes(q));
            const matchBands = e.lineups?.some(l => l.performer_name.toLowerCase().includes(q));
            if (!matchTitle && !matchVenue && !matchCity && !matchOrganizer && !matchGenre && !matchBands) {
              return false;
            }
          }

          return true;
        });
      }, [events, selectedGenre, timeFilter, searchQuery]);

      // --- SUBMISSION HANDLER ---
      const handleSubmission = (formData) => {
        // Honeypot spam test
        if (formData.honeypot) {
          showToast("Spam detected. Discarded.");
          return;
        }

        // Duplicate check
        const isDuplicate = events.some(e => 
          e.title.toLowerCase() === formData.title.trim().toLowerCase() &&
          e.venue_name.toLowerCase() === formData.venue.trim().toLowerCase()
        );

        if (isDuplicate) {
          showToast("Warning: A gig with this name and venue is already on record.");
          return;
        }

        const newSub = {
          id: `sub-${Date.now()}`,
          title: formData.title,
          genre_tags: formData.genres,
          event_type: formData.event_type || 'gig',
          description: formData.description,
          start_time: formData.date_time,
          venue_name: formData.venue,
          city: formData.city || 'Cagayan de Oro City',
          venue_address: formData.address,
          poster_image_url: formData.poster_url || 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=900&q=80',
          band_lineup_text: formData.lineup,
          ticket_price_php: Number(formData.price) || 0,
          is_free_entry: formData.is_free,
          ticket_link: formData.ticket_link,
          organizer_name: formData.organizer,
          contact_email: formData.email,
          contact_social: formData.social,
          age_restriction: formData.age || 'All Ages',
          accessibility_notes: formData.accessibility,
          status: 'pending',
          created_at: new Date().toISOString()
        };

        setSubmissions(prev => [newSub, ...prev]);
        showToast("SUBMISSION RECEIVED! Awaiting admin review.");
        navigateTo('events');
      };

      // --- ADMIN APPROVAL HANDLER ---
      const handleApproveSub = (sub) => {
        const slug = sub.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '-' + Math.floor(Math.random() * 900 + 100);
        const published = {
          id: `e-${Date.now()}`,
          slug,
          title: sub.title,
          tagline: sub.description.slice(0, 95) + '...',
          description: sub.description,
          event_type: sub.event_type,
          genre_tags: sub.genre_tags.length ? sub.genre_tags : ['Alternative and Indie'],
          status: 'upcoming',
          start_time: sub.start_time,
          doors_open_time: '7:00 PM',
          venue_name: sub.venue_name,
          venue_address: sub.venue_address,
          city: sub.city,
          ticket_price_php: sub.ticket_price_php,
          is_free_entry: sub.is_free_entry,
          ticket_link: sub.ticket_link,
          poster_image_url: sub.poster_image_url,
          organizer_name_override: sub.organizer_name,
          is_verified: true,
          verified_by: 'Admin (Verified Community Submission)',
          last_verified_at: new Date().toISOString(),
          age_restriction: sub.age_restriction,
          accessibility_info: sub.accessibility_notes,
          lineups: sub.band_lineup_text ? sub.band_lineup_text.split(',').map(name => ({
            performer_name: name.trim(),
            set_time: 'TBA',
            is_headliner: false
          })) : []
        };

        setEvents(prev => [published, ...prev]);
        setSubmissions(prev => prev.map(s => s.id === sub.id ? { ...s, status: 'approved' } : s));
        showToast(`Approved "${sub.title}" and published to verified feed!`);
      };

      const handleRejectSub = (id) => {
        setSubmissions(prev => prev.map(s => s.id === id ? { ...s, status: 'rejected' } : s));
        showToast("Submission marked as rejected.");
      };

      const handleUpdateStatus = (eventId, newStatus) => {
        setEvents(prev => prev.map(e => e.id === eventId ? { ...e, status: newStatus, last_verified_at: new Date().toISOString() } : e));
        showToast(`Status updated to ${newStatus}`);
      };

      // Selected event for detail view
      const selectedEvent = events.find(e => e.slug === currentSlug) || events[0];

      return (
        <div className="min-h-screen text-paper flex flex-col font-sans">
          {/* TOAST NOTIFICATION */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-oxblood text-paper px-6 py-3 border-2 border-paper shadow-brutal font-typewriter text-sm tracking-wide animate-bounce">
              ★ {toastMessage}
            </div>
          )}

          {/* TOP UTILITY BAR / THRIFT SOLIDARITY */}
          <header className="bg-ink border-b-2 border-stone-800 text-xs text-stone-300 py-2 px-4">
            <div className="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-2">
              <div className="flex items-center space-x-3">
                <span className="bg-oxblood text-paper px-2 py-0.5 font-bold uppercase tracking-wider text-[10px]">
                  CAGAYAN DE ORO DIY UNION
                </span>
                <span className="font-typewriter text-stone-400 hidden sm:inline">
                  "BUY SECONDHAND. MAKE YOUR OWN. SUPPORT THE SCENE."
                </span>
              </div>
              <div className="flex items-center space-x-4">
                <button 
                  onClick={() => setIsAdmin(!isAdmin)}
                  className={`text-[11px] font-typewriter underline ${isAdmin ? 'text-amber-400 font-bold' : 'text-stone-400 hover:text-paper'}`}>
                  {isAdmin ? '★ Mode: ADMIN ACTIVE' : 'Switch to Admin Access'}
                </button>
                <span className="text-stone-600">|</span>
                <button onClick={() => navigateTo('shop')} className="hover:text-amber-300 font-bold">
                  Thrift Racks & Custom Fits
                </button>
              </div>
            </div>
          </header>

          {/* MAIN BRAND HEADER & NAV */}
          <nav className="bg-ink-light border-b-4 border-oxblood sticky top-0 z-40 shadow-2xl">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap justify-between items-center gap-4">
              <div className="cursor-pointer" onClick={() => navigateTo('home')}>
                <div className="flex items-center space-x-2">
                  <span className="text-4xl sm:text-5xl font-poster tracking-tighter text-paper leading-none hover:text-oxblood-bright transition">
                    CDO UNDERGROUND
                  </span>
                  <span className="rubber-stamp text-[10px] hidden md:inline-block">OFFICIAL SCENE REGISTRY</span>
                </div>
                <p className="text-[11px] font-typewriter text-stone-400 tracking-wider">
                  NORTHERN MINDANAO NOISE ARCHIVE • THRIFT SHOP DIY HUB
                </p>
              </div>

              {/* NAV LINKS */}
              <div className="flex items-center flex-wrap gap-1 sm:gap-2 text-sm font-bold tracking-wide">
                {[
                  { id: 'events', label: 'GIGS & EVENTS' },
                  { id: 'bands', label: 'BAND DIRECTORY' },
                  { id: 'calendar', label: 'DIY CALENDAR' },
                  { id: 'archive', label: 'GIG ARCHIVE' },
                  { id: 'shop', label: 'GIG FITS & MERCH' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => navigateTo(tab.id)}
                    className={`px-3 py-1.5 transition uppercase text-xs sm:text-sm font-poster tracking-wider ${
                      route === tab.id 
                        ? 'bg-paper text-ink shadow-brutal border-2 border-ink' 
                        : 'text-stone-300 hover:text-paper hover:bg-stone-800'
                    }`}>
                    {tab.label}
                  </button>
                ))}

                {isAdmin && (
                  <button
                    onClick={() => navigateTo('admin')}
                    className={`px-3 py-1.5 uppercase text-xs sm:text-sm font-poster tracking-wider border-2 border-amber-400 ${
                      route === 'admin' ? 'bg-amber-400 text-ink' : 'text-amber-400 hover:bg-amber-400/20'
                    }`}>
                    MODERATION ({submissions.filter(s => s.status === 'pending').length})
                  </button>
                )}

                <button
                  onClick={() => navigateTo('submit')}
                  className="bg-oxblood hover:bg-oxblood-bright text-paper px-4 py-1.5 font-poster text-sm sm:text-base tracking-wider border-2 border-paper shadow-brutal transition transform active:scale-95 ml-2">
                  + SUBMIT A GIG
                </button>
              </div>
            </div>
          </nav>

          {/* MAIN CONTENT ROUTING */}
          <main className="flex-grow">
            {route === 'home' && (
              <HomeSection navigateTo={navigateTo} events={events} products={THRIFT_PRODUCTS} />
            )}

            {route === 'events' && (
              <EventsListSection 
                events={filteredEvents}
                allEvents={events}
                selectedGenre={selectedGenre}
                setSelectedGenre={setSelectedGenre}
                timeFilter={timeFilter}
                setTimeFilter={setTimeFilter}
                searchQuery={searchQuery}
                setSearchQuery={setSearchQuery}
                navigateTo={navigateTo}
                toggleSave={toggleSave}
                savedIds={savedIds}
              />
            )}

            {route === 'event-detail' && (
              <EventDetailSection 
                event={selectedEvent}
                allEvents={events}
                navigateTo={navigateTo}
                toggleSave={toggleSave}
                isSaved={savedIds.includes(selectedEvent.id)}
                showToast={showToast}
                products={THRIFT_PRODUCTS}
              />
            )}

            {route === 'bands' && (
              <BandsSection 
                bands={BANDS_DATA} 
                events={events}
                navigateTo={navigateTo}
                showToast={showToast}
              />
            )}

            {route === 'calendar' && (
              <CalendarSection 
                events={events}
                view={calendarView}
                setView={setCalendarView}
                navigateTo={navigateTo}
              />
            )}

            {route === 'archive' && (
              <ArchiveSection 
                events={events.filter(e => e.status === 'completed' || new Date(e.start_time) < new Date())}
                archiveYear={archiveYear}
                setArchiveYear={setArchiveYear}
                navigateTo={navigateTo}
                showToast={showToast}
              />
            )}

            {route === 'submit' && (
              <SubmitEventSection 
                onSubmit={handleSubmission}
                navigateTo={navigateTo}
              />
            )}

            {route === 'shop' && (
              <ShopSection 
                products={THRIFT_PRODUCTS}
                events={events}
                navigateTo={navigateTo}
                showToast={showToast}
              />
            )}

            {route === 'admin' && (
              <AdminSection 
                submissions={submissions}
                events={events}
                onApprove={handleApproveSub}
                onReject={handleRejectSub}
                onUpdateStatus={handleUpdateStatus}
                navigateTo={navigateTo}
              />
            )}
          </main>

          {/* FOOTER */}
          <footer className="bg-ink border-t-4 border-oxblood text-stone-400 py-12 px-4 mt-20">

              <div className="col-span-1 md:col-span-2">
                <span className="text-3xl font-poster text-paper">CDO UNDERGROUND</span>
                <p className="font-typewriter text-xs text-stone-400 mt-2 max-w-md leading-relaxed">

                  Preserving local gig flyers, supporting independent live spaces, and clothing the scene in authentic secondhand garments.
                </p>
                <div className="mt-4 flex flex-wrap gap-2">
                  <span className="rubber-stamp text-[10px]">100% DIY</span>
                  <span className="rubber-stamp text-[10px] rubber-stamp-black text-stone-300 border-stone-500">NO SCALPERS</span>
                  <span className="rubber-stamp text-[10px] border-emerald-600 text-emerald-400">SAFE MOSH PITS</span>
                </div>
              </div>

              <div>
                <h4 className="font-poster text-lg text-paper tracking-wider mb-3">SCENE DIRECTORY</h4>
                <ul className="text-xs space-y-2 font-mono">
                  <li><button onClick={() => navigateTo('events')} className="hover:text-paper">→ Gig Poster Wall</button></li>
                  <li><button onClick={() => navigateTo('bands')} className="hover:text-paper">→ CDO Band Roster</button></li>
                  <li><button onClick={() => navigateTo('calendar')} className="hover:text-paper">→ DIY Workshops & Swaps</button></li>
                  <li><button onClick={() => navigateTo('archive')} className="hover:text-paper">→ Underground Gig Archive</button></li>
                  <li><button onClick={() => navigateTo('submit')} className="hover:text-paper">→ Submit Your Gig Announcement</button></li>
                </ul>
              </div>

              <div>
                <h4 className="font-poster text-lg text-paper tracking-wider mb-3">THRIFT SOLIDARITY</h4>
                <p className="text-xs font-typewriter text-stone-400 mb-2">
                  "BUY SECONDHAND. MAKE YOUR OWN. SUPPORT THE SCENE."
                </p>
                <p className="text-[11px] text-stone-500 leading-normal">
                  Band names and flyer credits remain the intellectual property of the respective artists and organizers. Unofficial community tribute page.
                </p>
                <div className="mt-4 pt-4 border-t border-stone-800 text-[10px] font-mono text-stone-600">
                  © 2026 CDO Underground Scene Hub • Powered by React & Supabase
                </div>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // ============================================================================
    // 1. HOME SECTION (INTEGRATION HUB)
    // ============================================================================
    function HomeSection({ navigateTo, events, products }) {
      const upcoming = events.filter(e => e.status !== 'completed').slice(0, 3);
      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-8">
          {/* HERO BANNER */}
          <div className="relative border-4 border-paper bg-stone-900 shadow-brutal-lg overflow-hidden mb-12">
            <div className="absolute top-2 right-4 z-20 tape-strip-alt px-4 py-1 text-ink font-typewriter text-xs font-bold">
              CAGAYAN DE ORO CITY • ISSUE #2026
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-12">
              <div className="lg:col-span-7 p-6 sm:p-12 flex flex-col justify-center">

    // ============================================================================
    // 3. EVENT DETAIL SECTION (FLYER INSPECTOR & TICKETING)
    // ============================================================================
    function EventDetailSection({ event, allEvents, navigateTo, toggleSave, isSaved, showToast, products }) {
      if (!event) return null;

      const isPast = event.status === 'completed' || new Date(event.start_time) < new Date();
      const related = allEvents.filter(e => e.id !== event.id && e.genre_tags.some(g => event.genre_tags.includes(g))).slice(0, 3);
      
      // Matched thrift pieces for "Build Your Gig Fit"
      const gigFits = products.filter(p => event.featured_gig_fit_ids?.includes(p.id) || p.underground_tag === event.curated_thrift_tag).slice(0, 3);

      // Download .ICS calendar file
      const downloadIcs = () => {
        const start = new Date(event.start_time).toISOString().replace(/-|:|\.\d\d\d/g, "");
        const end = new Date(new Date(event.start_time).getTime() + 4 * 3600 * 1000).toISOString().replace(/-|:|\.\d\d\d/g, "");
        const icsData = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-//CDO Underground//Event Flyer//EN',
          'BEGIN:VEVENT',
          `SUMMARY:${event.title}`,
          `DESCRIPTION:${event.description.replace(/\n/g, ' ')}`,
          `LOCATION:${event.venue_name}, ${event.venue_address}, ${event.city}`,
          `DTSTART:${start}`,
          `DTEND:${end}`,
          'STATUS:CONFIRMED',
          'END:VEVENT',
          'END:VCALENDAR'
        ].join('\r\n');

        const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8' });
        const link = document.createElement('a');
        link.href = window.URL.createObjectURL(blob);
        link.setAttribute('download', `${event.slug}.ics`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast("Calendar event file (.ics) downloaded!");
      };

      // Share Event
      const handleShare = () => {
        if (navigator.share) {
          navigator.share({
            title: event.title,
            text: `CDO Underground Gig: ${event.title} at ${event.venue_name}`,
            url: window.location.href
          }).catch(() => {});
        } else {
          navigator.clipboard.writeText(window.location.href);
          showToast("Gig link copied to clipboard!");
        }
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-8">
          {/* BREADCRUMB */}
          <div className="flex items-center space-x-2 text-xs font-mono text-stone-400 mb-6">
            <button onClick={() => navigateTo('events')} className="hover:text-paper">← BACK TO ALL FLYERS</button>
            <span>/</span>
            <span className="text-oxblood font-bold">{event.title}</span>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-12">
            {/* LEFT COLUMN: LARGE GIG POSTER */}
            <div className="lg:col-span-5">
              <div className="paper-texture p-4 border-4 border-ink shadow-brutal-lg relative">
                <div className="tape-strip absolute -top-3 left-6 px-4 py-0.5 text-xs font-typewriter text-ink font-bold">
                  OFFICIAL CDO FLYER SCAN
                </div>

                <div className="aspect-[3/4] bg-stone-900 border-2 border-ink overflow-hidden mb-3">
                  <img 
                    src={event.poster_image_url} 
                    alt={event.title} 
                    className="w-full h-full object-cover filter contrast-125 grayscale hover:grayscale-0 transition duration-300"
                  />
                </div>

                {event.poster_credit && (
                  <p className="font-typewriter text-[11px] text-stone-600 text-center italic">
                    ★ {event.poster_credit}
                  </p>
                )}

                {/* VERIFICATION BADGE */}
                <div className="mt-4 pt-3 border-t-2 border-dashed border-stone-400 bg-stone-100 p-3 text-ink text-xs font-mono">
                  <div className="flex items-center text-emerald-800 font-bold mb-1">
                    <IconShield />
                    <span>LAST VERIFIED: {new Date(event.last_verified_at || event.start_time).toLocaleDateString()}</span>
                  </div>
                  <p className="text-[11px] text-stone-600">
                    Source: {event.verified_by || 'Admin verified via official promoter announcement'}
                  </p>
                </div>
              </div>

              {/* ACTION TOOLBAR */}
              <div className="flex gap-2 mt-4">
                <button
                  onClick={downloadIcs}
                  className="flex-1 bg-ink text-paper hover:bg-stone-800 border-2 border-paper py-2.5 font-poster tracking-wider text-sm shadow-brutal">
                  <IconCalendar /> ADD TO CALENDAR (.ICS)
                </button>
                <button
                  onClick={handleShare}
                  className="bg-oxblood hover:bg-oxblood-bright text-paper px-4 py-2.5 border-2 border-paper font-poster tracking-wider text-sm shadow-brutal">
                  <IconShare /> SHARE
                </button>
                <button
                  onClick={() => toggleSave(event.id)}
                  className={`px-4 py-2.5 border-2 border-paper font-poster tracking-wider text-sm shadow-brutal ${isSaved ? 'bg-amber-400 text-ink font-bold' : 'bg-stone-900 text-paper'}`}>

            <div className="lg:col-span-7 flex flex-col justify-between">

                {/* GENRE PILLS & STAMPS */}

                <h1 className="text-4xl sm:text-6xl font-poster text-paper tracking-tight leading-none mb-3">

          {/* CONNECT WITH THE THRIFT SHOP: BUILD YOUR GIG FIT */}

                <div>
                  <span className="font-typewriter text-xs text-oxblood font-bold uppercase">
                    THRIFT SHOP X UNDERGROUND COLLABORATION
                  </span>
                  <h3 className="font-poster text-3xl sm:text-4xl text-paper">
                    BUILD YOUR GIG FIT FOR THIS SHOW
                  </h3>
                  <p className="font-typewriter text-xs text-stone-400 mt-1">
                    Pre-loved denim, battle-ready vests, and DIY canvas accessories tailored for CDO pit culture.
                  </p>

                  onClick={() => navigateTo('shop')}
                  className="text-xs font-poster text-amber-300 hover:underline">

                </button>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">

                  <div key={item.id} className="border-2 border-stone-700 bg-stone-900 p-3 flex flex-col justify-between">
                    <div>
                      <div className="aspect-square bg-stone-950 overflow-hidden mb-2 border border-stone-800">

                      <h4 className="font-poster text-xl text-paper leading-tight">{item.title}</h4>

                        RESERVE FIT
                      </button>

              </div>
            </div>
          )}

          {/* RELATED EVENTS */}
          {related.length > 0 && (
            <div>
              <h3 className="font-poster text-3xl text-paper tracking-wider mb-4">MORE SESSIONS IN THIS GENRE</h3>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {related.map(rel => (
                  <div 
                    key={rel.id} 
                    onClick={() => navigateTo('event-detail', rel.slug)}
                    className="border-2 border-paper bg-stone-900 p-4 cursor-pointer hover:border-oxblood transition">
                    <span className="font-typewriter text-[10px] text-oxblood font-bold">
                      {new Date(rel.start_time).toLocaleDateString()} • {rel.venue_name}
                    </span>
                    <h4 className="font-poster text-2xl text-paper leading-none mt-1">{rel.title}</h4>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );

    // ============================================================================
    // 4. BAND & COLLECTIVE DIRECTORY
    // ============================================================================
    function BandsSection({ bands, events, navigateTo, showToast }) {
      const [search, setSearch] = useState('');
      const [selectedGenre, setSelectedGenre] = useState('All');
      const [showJoinModal, setShowJoinModal] = useState(false);

      const filtered = bands.filter(b => {
        if (selectedGenre !== 'All' && !b.genre_tags.includes(selectedGenre)) return false;
        if (search.trim()) {
          const q = search.toLowerCase();
          return b.name.toLowerCase().includes(q) || b.location.toLowerCase().includes(q) || b.short_bio.toLowerCase().includes(q);
        }
        return true;
      });

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-8">
          <div className="border-b-4 border-oxblood pb-6 mb-8 flex flex-wrap justify-between items-end gap-4">
            <div>
              <span className="text-oxblood font-typewriter text-xs uppercase tracking-widest font-bold">
                ROUTE: /community/bands • LOCAL & VISITING CREATORS
              </span>
              <h1 className="text-5xl sm:text-7xl font-poster text-paper tracking-tight leading-none mt-1">
                BAND & COLLECTIVE DIRECTORY
              </h1>
              <p className="font-typewriter text-stone-300 text-sm max-w-2xl mt-2">
                Discover independent bands, noise collectives, DIY screenprinters, and zine unions based in Cagayan de Oro City.
              </p>
            </div>

            <button
              onClick={() => setShowJoinModal(true)}
              className="bg-oxblood hover:bg-oxblood-bright text-paper px-5 py-2 font-poster text-lg border-2 border-paper shadow-brutal">
              + REQUEST A BAND PROFILE
            </button>
          </div>

          {/* SEARCH & FILTERS */}
          <div className="flex flex-col sm:flex-row gap-4 mb-8">
            <input
              type="text"
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              placeholder="SEARCH BANDS, CREATIVES, COLLECTIVES..."
              className="flex-grow bg-stone-900 border-2 border-stone-700 px-4 py-2 text-sm font-mono text-paper focus:border-oxblood focus:outline-none"
            />
            <select
              value={selectedGenre}
              onChange={(e) => setSelectedGenre(e.target.value)}
              className="bg-stone-900 border-2 border-stone-700 px-4 py-2 text-sm font-mono text-paper focus:border-oxblood focus:outline-none">
              <option value="All">All Styles ({bands.length})</option>
              {GENRE_LIST.map(g => (
                <option key={g} value={g}>{g}</option>
              ))}
            </select>
          </div>

          {/* DIRECTORY GRID */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            {filtered.map(band => {
              // Find upcoming gigs featuring this band
              const upcomingGigs = events.filter(e => 
                e.lineups?.some(l => l.performer_name.toLowerCase().includes(band.name.toLowerCase()))
              );

              return (
                <div key={band.id} className="paper-texture border-4 border-ink p-5 text-ink shadow-brutal flex flex-col justify-between">
                  <div>
                    <div className="aspect-[4/3] bg-stone-900 border-2 border-ink overflow-hidden mb-3">
                      <img src={band.image} alt={band.name} className="w-full h-full object-cover filter contrast-125 grayscale hover:grayscale-0 transition duration-300" />
                    </div>

                    <div className="flex flex-wrap gap-1 mb-2">
                      {band.genre_tags.map(g => (
                        <span key={g} className="bg-ink text-paper text-[9px] font-mono px-2 py-0.5 uppercase font-bold">
                          {g}
                        </span>
                      ))}
                    </div>

                    <h3 className="font-poster text-3xl text-ink leading-tight">{band.name}</h3>
                    <p className="font-typewriter text-xs text-oxblood font-bold mb-2">📍 {band.location}</p>
                    <p className="font-mono text-xs text-stone-800 leading-relaxed mb-4">{band.short_bio}</p>

                    {band.members && (
                      <div className="text-[11px] font-mono text-stone-700 mb-3 pt-2 border-t border-dashed border-stone-400">
                        <strong className="text-ink">MEMBERS:</strong> {band.members.join(' • ')}
                      </div>
                    )}
                  </div>

                  <div>
                    {/* UPCOMING GIGS BY THIS BAND */}
                    {upcomingGigs.length > 0 && (
                      <div className="mb-4 bg-stone-200 border border-stone-400 p-2 text-xs font-mono">
                        <span className="font-bold text-oxblood block">NEXT GIG:</span>
                        {upcomingGigs.map(g => (
                          <div key={g.id} onClick={() => navigateTo('event-detail', g.slug)} className="hover:underline cursor-pointer font-poster text-sm text-ink truncate">
                            → {g.title} ({new Date(g.start_time).toLocaleDateString()})
                          </div>
                        ))}
                      </div>
                    )}

                    {/* STREAMING & CONTACT */}
                    <div className="pt-3 border-t-2 border-ink flex justify-between items-center text-xs font-mono">
                      <div className="space-x-2">
                        {band.spotify && <a href={band.spotify} target="_blank" rel="noopener noreferrer" className="text-oxblood font-bold hover:underline">Spotify ↗</a>}
                        {band.bandcamp && <a href={band.bandcamp} target="_blank" rel="noopener noreferrer" className="text-oxblood font-bold hover:underline">Bandcamp ↗</a>}
                      </div>
                      <span className="text-[10px] text-stone-600 truncate max-w-[120px]">{band.booking}</span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          {/* REQUEST PROFILE MODAL */}
          {showJoinModal && (
            <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
              <div className="paper-texture border-4 border-ink p-6 max-w-lg w-full text-ink shadow-brutal relative">
                <button 
                  onClick={() => setShowJoinModal(false)}
                  className="absolute top-3 right-4 font-poster text-2xl hover:text-oxblood">
                  ✕
                </button>
                <div className="rubber-stamp text-xs mb-2">ARTIST APPLICATION</div>
                <h3 className="font-poster text-3xl text-ink mb-1">REQUEST A BAND / CREATIVE PROFILE</h3>
                <p className="font-typewriter text-xs text-stone-700 mb-4">
                  For CDO & Northern Mindanao acts, zine creators, and DIY spaces. All requests are verified by admins.
                </p>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  showToast("Profile request submitted! Admins will verify your music links.");
                  setShowJoinModal(false);
                }} className="space-y-3 font-mono text-xs">
                  <div>
                    <label className="block font-bold">BAND / COLLECTIVE NAME *</label>
                    <input required className="w-full bg-stone-100 border-2 border-ink p-2 text-ink" placeholder="e.g. Broken Glass Syndicate" />
                  </div>
                  <div>
                    <label className="block font-bold">GENRE / CREATIVE INTEREST *</label>
                    <input required className="w-full bg-stone-100 border-2 border-ink p-2 text-ink" placeholder="e.g. Screamo / Post-Hardcore" />
                  </div>
                  <div>
                    <label className="block font-bold">LOCATION IN CDO *</label>
                    <input required className="w-full bg-stone-100 border-2 border-ink p-2 text-ink" placeholder="e.g. Nazareth, CDO" />
                  </div>
                  <div>
                    <label className="block font-bold">STREAMING / SOCIAL / BANDCAMP LINK *</label>
                    <input required className="w-full bg-stone-100 border-2 border-ink p-2 text-ink" placeholder="https://bandcamp.com/..." />
                  </div>
                  <div>
                    <label className="block font-bold">CONTACT EMAIL *</label>
                    <input required type="email" className="w-full bg-stone-100 border-2 border-ink p-2 text-ink" placeholder="band@gmail.com" />
                  </div>
                  <div className="pt-2">
                    <button type="submit" className="w-full bg-oxblood text-paper font-poster text-lg py-2 border-2 border-ink shadow-brutal">
                      SUBMIT PROFILE REQUEST
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============================================================================
    // 5. DIY COMMUNITY CALENDAR (MUSIC + NON-MUSIC ACTIVITIES)
    // ============================================================================
    function CalendarSection({ events, view, setView, navigateTo }) {
      const [filterType, setFilterType] = useState('all'); // 'all', 'music', 'workshop', 'thrift'

      const calendarEvents = events.filter(e => {
        if (filterType === 'music' && e.event_type !== 'gig') return false;
        if (filterType === 'workshop' && e.event_type !== 'diy_workshop') return false;
        if (filterType === 'thrift' && e.event_type !== 'thrift_market' && e.event_type !== 'zine_fair') return false;
        return true;
      });

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-8">
          <div className="border-b-4 border-oxblood pb-6 mb-8 flex flex-wrap justify-between items-end gap-4">
            <div>
              <span className="text-oxblood font-typewriter text-xs uppercase tracking-widest font-bold">
                ROUTE: /community/calendar • CDO DIY CULTURE LOG
              </span>
              <h1 className="text-5xl sm:text-7xl font-poster text-paper tracking-tight leading-none mt-1">
                DIY COMMUNITY CALENDAR
              </h1>
              <p className="font-typewriter text-stone-300 text-sm max-w-2xl mt-2">
                Bringing together music gigs and non-music underground activities: patch-making, screen-printing, clothing repair, thrift swaps, and zine sessions.
              </p>
            </div>

            <div className="flex gap-2">
              <button
                onClick={() => setView('calendar')}
                className={`px-4 py-2 font-poster text-base border-2 border-paper tracking-wider ${
                  view === 'calendar' ? 'bg-paper text-ink shadow-brutal' : 'bg-stone-900 text-stone-300'
                }`}>
                CALENDAR GRID
              </button>
              <button
                onClick={() => setView('list')}
                className={`px-4 py-2 font-poster text-base border-2 border-paper tracking-wider ${
                  view === 'list' ? 'bg-paper text-ink shadow-brutal' : 'bg-stone-900 text-stone-300'
                }`}>
                CHRONO LIST VIEW
              </button>
            </div>
          </div>

          {/* ACTIVITY TYPE FILTERS */}
          <div className="flex flex-wrap gap-2 mb-8 font-mono text-xs">
            {[
              { id: 'all', label: 'All Activities' },
              { id: 'music', label: 'Live Gigs & Noise Shows' },
              { id: 'workshop', label: 'Patch & Customization Labs' },
              { id: 'thrift', label: 'Thrift Swaps & Zine Fairs' }
            ].map(f => (
              <button
                key={f.id}
                onClick={() => setFilterType(f.id)}
                className={`px-3 py-1.5 transition ${
                  filterType === f.id ? 'bg-oxblood text-paper font-bold' : 'bg-stone-900 text-stone-400 hover:text-paper'
                }`}>
                {f.label}
              </button>
            ))}
          </div>

          {/* CALENDAR VIEW */}
          {view === 'calendar' ? (
            <div className="border-4 border-paper bg-stone-950 p-6 shadow-brutal">
              <div className="text-center font-poster text-3xl text-paper mb-4">
                OCTOBER / NOVEMBER 2026 SCHEDULE
              </div>
              
              {/* DAYS HEADER */}
              <div className="grid grid-cols-7 gap-2 mb-2 text-center font-typewriter text-xs text-stone-400 font-bold border-b border-stone-800 pb-2">
                <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
              </div>

              {/* MONTH MATRIX PREVIEW */}
              <div className="grid grid-cols-7 gap-2">
                {Array.from({ length: 31 }).map((_, i) => {
                  const day = i + 1;
                  // Match events on this day
                  const dayEvents = calendarEvents.filter(e => new Date(e.start_time).getDate() === day);

                  return (
                    <div 
                      key={day} 
                      className={`min-h-[100px] border border-stone-800 p-2 flex flex-col justify-between transition ${
                        dayEvents.length > 0 ? 'bg-stone-900/90 border-stone-600' : 'bg-stone-950/40 text-stone-600'
                      }`}>
                      <span className="font-mono text-xs font-bold">{day}</span>
                      <div className="space-y-1 mt-1">
                        {dayEvents.map(ev => (
                          <div 
                            key={ev.id}
                            onClick={() => navigateTo('event-detail', ev.slug)}
                            className="text-[10px] font-poster bg-oxblood text-paper p-1 truncate cursor-pointer hover:bg-oxblood-bright leading-tight shadow-sm"
                            title={ev.title}>
                            {ev.title}
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          ) : (
            /* LIST VIEW FOR MOBILE / QUICK SCAN */
            <div className="space-y-4">
              {calendarEvents.map(ev => (
                <div 
                  key={ev.id}
                  onClick={() => navigateTo('event-detail', ev.slug)}
                  className="border-2 border-paper bg-stone-900 p-4 shadow-brutal flex flex-col sm:flex-row justify-between items-start sm:items-center cursor-pointer hover:border-oxblood transition gap-4">
                  <div className="flex items-start space-x-4">
                    <div className="bg-oxblood text-paper text-center p-2 min-w-[70px]">
                      <span className="font-poster text-2xl block leading-none">
                        {new Date(ev.start_time).getDate()}
                      </span>
                      <span className="text-[10px] font-mono uppercase">
                        {new Date(ev.start_time).toLocaleDateString('en-US', { month: 'short' })}
                      </span>
                    </div>
                    <div>
                      <span className="text-[10px] font-mono text-oxblood uppercase font-bold">
                        {ev.event_type.replace('_', ' ')} • {ev.venue_name}
                      </span>
                      <h3 className="font-poster text-2xl text-paper leading-none mt-1">{ev.title}</h3>
                      <p className="font-typewriter text-xs text-stone-400 mt-1">{ev.tagline}</p>
                    </div>
                  </div>

                  <div className="text-right font-mono text-xs">
                    <span className="text-amber-300 font-bold block">{ev.is_free_entry ? 'FREE ENTRY' : `₱${ev.ticket_price_php}`}</span>
                    <span className="text-stone-400">DOORS: {ev.doors_open_time || 'TBA'}</span>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

                <div key={ev.id} className="p-4 flex flex-wrap justify-between items-center gap-3">
                  <div>
                    <h4 className="font-poster text-2xl text-paper">{ev.title}</h4>
                    <span className="text-stone-400">{new Date(ev.start_time).toLocaleDateString()} • {ev.venue_name}</span>
                  </div>

                  <div className="flex items-center space-x-2">
                    <span className="text-stone-400">STATUS:</span>
                    <select
                      value={ev.status}
                      onChange={(e) => onUpdateStatus(ev.id, e.target.value)}
                      className="bg-stone-900 border border-stone-700 text-paper px-2 py-1 font-mono text-xs">
                      <option value="upcoming">Upcoming</option>
                      <option value="sold_out">Sold Out</option>
                      <option value="postponed">Postponed</option>
                      <option value="cancelled">Cancelled</option>
                      <option value="completed">Completed / Archive</option>
                    </select>
                    <button
                      onClick={() => navigateTo('event-detail', ev.slug)}
                      className="text-amber-400 underline hover:text-paper ml-2">
                      Inspect
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
