    const IconClose = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="1.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>;

    const IconHeart = ({ filled }) => <svg className="w-4 h-4" fill={filled ? "#C62032" : "none"} stroke={filled ? "#C62032" : "currentColor"} strokeWidth="1.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/></svg>;

    // --- MAIN REACT APPLICATION COMPONENT ---
    function App() {
      // Routing state: 'home', 'shop', 'product-detail', 'diy', 'events', 'event-detail', 'community', 'about', 'admin'
      const [route, setRoute] = useState('home');
      const [activeSlug, setActiveSlug] = useState('reworked-heavy-denim-vest');

      // Global UI State

      const [activeLookbookModal, setActiveLookbookModal] = useState(null);
      const [activeDIYModal, setActiveDIYModal] = useState(null);

          return stored ? JSON.parse(stored) : INITIAL_PRODUCTS;
        } catch { return INITIAL_PRODUCTS; }
      });

      const [cart, setCart] = useState(() => {
        try {
          const stored = localStorage.getItem(`${STORAGE_PREFIX}cart`);
          return stored ? JSON.parse(stored) : [];

      const [bands] = useState(INITIAL_BANDS);
      const [lookbooks] = useState(INITIAL_LOOKBOOK);
      const [diyGuides] = useState(INITIAL_DIY_GUIDES);
      const [submissions, setSubmissions] = useState([]);
      const [wishlist, setWishlist] = useState([]);

      // URL Hash Sync for deep linking & browser back/forward
      useEffect(() => {
        const handleHash = () => {
          const hash = window.location.hash.replace('#', '') || 'home';
          if (hash.startsWith('product/')) {
            const slug = hash.replace('product/', '');
            setActiveSlug(slug);
            setRoute('product-detail');
          } else if (hash.startsWith('event/')) {
            const slug = hash.replace('event/', '');
            setActiveEventSlug(slug);
            setRoute('event-detail');
          } else if (['home', 'shop', 'diy', 'events', 'community', 'about', 'admin'].includes(hash)) {
            setRoute(hash);
          } else {
            setRoute('home');
          }
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.addEventListener('hashchange', handleHash);
        handleHash();
        return () => window.removeEventListener('hashchange', handleHash);
      }, []);

      // Storage sync
      useEffect(() => {
        localStorage.setItem(`${STORAGE_PREFIX}cart`, JSON.stringify(cart));
      }, [cart]);

      useEffect(() => {
        localStorage.setItem(`${STORAGE_PREFIX}products`, JSON.stringify(products));
      }, [products]);

      const navigateTo = (newRoute, slug = null) => {
        if (slug && newRoute === 'product-detail') {
          window.location.hash = `product/${slug}`;
        } else if (slug && newRoute === 'event-detail') {
          window.location.hash = `event/${slug}`;
        } else {
          window.location.hash = newRoute;
        }
      };

      const showNotification = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      // Cart Operations
      const addToCart = (product, qty = 1) => {
        setCart(prev => {
          const existing = prev.find(item => item.product.id === product.id);
          if (existing) {
            return prev.map(item => item.product.id === product.id ? { ...item, quantity: item.quantity + qty } : item);
          }
          return [...prev, { product, quantity: qty }];
        });
        showNotification(`Added "${product.title}" to bag`);
        setCartOpen(true);
      };

      const updateCartQty = (productId, delta) => {
        setCart(prev => {
          return prev.map(item => {
            if (item.product.id === productId) {
              const newQty = item.quantity + delta;
              return newQty > 0 ? { ...item, quantity: newQty } : null;
            }
            return item;
          }).filter(Boolean);
        });
      };

      const removeFromCart = (productId) => {
        setCart(prev => prev.filter(item => item.product.id !== productId));
      };

      const cartSubtotalPHP = useMemo(() => {
        return cart.reduce((sum, item) => sum + item.product.price_php * item.quantity, 0);
      }, [cart]);

      const cartCount = useMemo(() => {
        return cart.reduce((sum, item) => sum + item.quantity, 0);
      }, [cart]);

      const toggleWishlist = (productId) => {
        setWishlist(prev => {
          const exists = prev.includes(productId);
          showNotification(exists ? "Removed from private archive" : "Saved to private archive");
          return exists ? prev.filter(id => id !== productId) : [...prev, productId];
        });
      };

      // Search results
      const searchResults = useMemo(() => {
        if (!searchQuery.trim()) return { products: [], events: [], bands: [] };
        const q = searchQuery.toLowerCase();
        return {
          products: products.filter(p => p.title.toLowerCase().includes(q) || p.category.toLowerCase().includes(q) || p.description.toLowerCase().includes(q)),
          events: events.filter(e => e.title.toLowerCase().includes(q) || e.venue_name.toLowerCase().includes(q) || e.genre_tags.some(g => g.toLowerCase().includes(q))),
          bands: bands.filter(b => b.name.toLowerCase().includes(q) || b.genre_tags.some(g => g.toLowerCase().includes(q)))
        };
      }, [searchQuery, products, events, bands]);

      const handleEventSubmit = (form) => {

          venue_name: form.venue,

          ticket_price_php: Number(form.price) || 0,
          is_free_entry: form.is_free,
          organizer_name: form.organizer,
          status: 'pending'

        setSubmissions(prev => [newSub, ...prev]);
        setShowSubmitModal(false);
        showNotification("Event submitted for editorial review");
      };

      const selectedEvent = events.find(e => e.slug === activeEventSlug || e.id === activeEventSlug) || events[0];

    // ============================================================================
    // 4. SHOP PAGE (PRODUCT LISTING WITH EDITORIAL FILTERS)
    // ============================================================================
    function ShopPage({ products, navigateTo, addToCart, toggleWishlist, wishlist }) {
      const [category, setCategory] = useState('all');
      const [conditionFilter, setConditionFilter] = useState('all');
      const [sortBy, setSortBy] = useState('featured');
      const [search, setSearch] = useState('');

      const filtered = useMemo(() => {
        return products.filter(p => {
          if (category !== 'all' && p.category !== category) return false;
          if (conditionFilter !== 'all' && p.condition !== conditionFilter) return false;
          if (search.trim()) {
            const q = search.toLowerCase();
            return p.title.toLowerCase().includes(q) || p.description.toLowerCase().includes(q) || p.size.toLowerCase().includes(q);
          }
          return true;
        }).sort((a, b) => {
          if (sortBy === 'price-low') return a.price_php - b.price_php;
          if (sortBy === 'price-high') return b.price_php - a.price_php;
          return 0;
        });
      }, [products, category, conditionFilter, sortBy, search]);

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-8 py-12">
          {/* Header */}
          <div className="border-b border-border-light pb-8 mb-8">
            <span className="text-[10px] tracking-editorial uppercase text-crimson font-semibold block mb-1">
              CIRCULAR APPAREL & SURPLUS
            </span>
            <h1 className="text-4xl sm:text-6xl font-bold tracking-tight text-black uppercase">
              THE STORE COLLECTION
            </h1>
            <p className="text-xs sm:text-sm text-gray max-w-xl mt-2 leading-relaxed">
              Hand-selected vintage, reconstructed workwear, and zero-waste tailoring. 
              Each item is a single-unit piece documented with exact measurements and garment imperfections.
            </p>
          </div>

          {/* Filter Toolbar */}
          <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 mb-8 pb-4 border-b border-border-light text-xs">
            {/* Category Pills */}
            <div className="flex flex-wrap gap-2">
              {[
                { id: 'all', label: 'All Pieces' },
                { id: 'outerwear', label: 'Outerwear' },
                { id: 'reworked', label: 'Reworked Studio' },
                { id: 'tops', label: 'Tops & Flannels' },
                { id: 'bottoms', label: 'Trousers & Denim' },
                { id: 'footwear', label: 'Footwear' },
                { id: 'patches', label: 'DIY Patches' }
              ].map(cat => (
                <button
                  key={cat.id}
                  onClick={() => setCategory(cat.id)}
                  className={`px-3 py-1.5 transition ${
                    category === cat.id 
                      ? 'bg-black text-white font-semibold' 
                      : 'bg-white text-gray hover:text-black border border-border-light'
                  }`}>
                  {cat.label}
                </button>
              ))}
            </div>

            {/* Sort & Search */}
            <div className="flex items-center space-x-3 w-full lg:w-auto">
              <input 
                type="text" 
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                placeholder="Search pieces..."
                className="bg-white border border-border-light px-3 py-1.5 text-xs text-black focus:outline-none focus:border-black flex-1 lg:w-48"
              />
              <select 
                value={sortBy} 
                onChange={(e) => setSortBy(e.target.value)}
                className="bg-white border border-border-light px-3 py-1.5 text-xs text-black focus:outline-none focus:border-black">
                <option value="featured">Sort: Featured</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
              </select>
            </div>
          </div>

          {/* Active Count */}
          <div className="text-[11px] font-mono text-gray mb-6">
            SHOWING <strong>{filtered.length}</strong> INDEPENDENT PIECES
          </div>

          {/* Product Grid */}
          {filtered.length > 0 ? (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
              {filtered.map(p => (
                <ProductCard 
                  key={p.id} 
                  product={p} 
                  navigateTo={navigateTo}
                  addToCart={addToCart}
                  toggleWishlist={toggleWishlist}
                  isWishlisted={wishlist.includes(p.id)}
                />
              ))}
            </div>
          ) : (
            <div className="py-24 text-center border border-border-light bg-white">
              <span className="text-2xl font-serif text-gray block mb-2">No Matching Pieces</span>
              <p className="text-xs text-gray">Adjust your active category or search query.</p>
              <button 
                onClick={() => { setCategory('all'); setSearch(''); }}
                className="mt-4 text-xs font-semibold tracking-editorial uppercase text-crimson underline">
                RESET FILTERS
              </button>
            </div>
          )}
        </div>
      );
    }

    // ============================================================================

    // ============================================================================
    function EventDetailPage({ event, allEvents, products, navigateTo, addToCart, showNotification }) {
      if (!event) return null;

      // Add to Calendar .ics generator
      const downloadIcs = () => {
        const start = new Date(event.start_time).toISOString().replace(/-|:|\.\d\d\d/g, "");
        const end = new Date(new Date(event.start_time).getTime() + 4 * 3600 * 1000).toISOString().replace(/-|:|\.\d\d\d/g, "");
        const icsData = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-//CDO Archive//Gig Registry//EN',
          'BEGIN:VEVENT',
          `SUMMARY:${event.title}`,
          `DESCRIPTION:${event.description.replace(/\n/g, ' ')}`,
          `LOCATION:${event.venue_name}, ${event.venue_address}, ${event.city}`,
          `DTSTART:${start}`,
          `DTEND:${end}`,
          'END:VEVENT',
          'END:VCALENDAR'
        ].join('\r\n');

        const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8' });
        const link = document.createElement('a');
        link.href = window.URL.createObjectURL(blob);
        link.setAttribute('download', `${event.slug}.ics`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showNotification("Gig schedule (.ics) downloaded to device");
      };

      const matchedFits = products.slice(0, 3);

      return (

                  VERIFIED GIG

              </div>
              {event.poster_credit && (
                <p className="text-[10px] text-gray italic text-center font-mono">

            {/* Right 6 Cols: Specifications & Lineup */}

              <div>
                <div className="flex flex-wrap gap-2 mb-3">
                  {event.genre_tags.map(g => (
                    <span key={g} className="text-[10px] font-mono uppercase bg-soft-white border border-border-light px-2.5 py-1 text-black font-semibold">
                      {g}
                    </span>
                  ))}
                </div>

                <h1 className="text-4xl sm:text-5xl font-bold tracking-tight text-black mt-2 leading-tight">
                  {event.title}
                </h1>

                {event.tagline && (
                  <p className="text-xs text-crimson font-medium tracking-wide mt-2">
                    "{event.tagline}"

                )}

                {/* Logistics */}
                <div className="border-t border-b border-border-light py-6 my-6 grid grid-cols-2 gap-4 text-xs">
                  <div>
                    <span className="text-[10px] tracking-editorial uppercase text-gray block">DATE & DOORS</span>
                    <strong className="text-black text-sm block mt-0.5">
                      {new Date(event.start_time).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })}

                    <span className="text-gray text-xs">Doors Open: {event.doors_open_time || '7:00 PM'}</span>
                  </div>

                  <div>
                    <span className="text-[10px] tracking-editorial uppercase text-gray block">VENUE & LOCATION</span>

                {/* About & Lineup */}

                <span className="text-[10px] tracking-editorial uppercase text-crimson font-semibold block mb-1">

                SEE COMPLETE THRIFT COLLECTION →

            </div>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-8">
              {matchedFits.map(fit => (
                <ProductCard 
                  key={fit.id} 
                  product={fit} 
                  navigateTo={navigateTo}
                  addToCart={addToCart}
                  toggleWishlist={() => {}}
                  isWishlisted={false}
                />
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // 11. ADMIN MODERATION PANEL
    // ============================================================================
    function AdminPage({ submissions, events, setSubmissions, setEvents, showNotification }) {
      const handleApprove = (sub) => {
        const slug = sub.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '-' + Math.floor(Math.random() * 900 + 100);
        const newEvent = {
          id: `ev-${Date.now()}`,
          slug,
          title: sub.title,
          tagline: sub.description.slice(0, 85) + '...',
          description: sub.description,
          event_type: sub.event_type,
          genre_tags: sub.genre_tags,
          status: 'upcoming',
          start_time: sub.start_time,
          doors_open_time: '7:00 PM',
          venue_name: sub.venue_name,
          venue_address: sub.venue_address,
          city: sub.city,
          ticket_price_php: sub.ticket_price_php,
          is_free_entry: sub.is_free_entry,
          poster_image_url: sub.poster_url,
          organizer_name_override: sub.organizer_name,
          is_verified: true,
          verified_by: 'Admin Editorial Approval',
          last_verified_at: new Date().toISOString()
        };

        setEvents(prev => [newEvent, ...prev]);
        setSubmissions(prev => prev.map(s => s.id === sub.id ? { ...s, status: 'approved' } : s));
        showNotification(`Approved and published "${sub.title}"`);
      };

      const handleReject = (id) => {
        setSubmissions(prev => prev.map(s => s.id === id ? { ...s, status: 'rejected' } : s));
        showNotification("Submission rejected");
      };

      const pending = submissions.filter(s => s.status === 'pending');

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-8 py-12">
          <div className="border-b border-border-light pb-6 mb-8 flex justify-between items-center">
            <div>
              <span className="badge-crimson">EDITORIAL SYSTEM</span>
              <h1 className="text-3xl font-bold text-black mt-2">COMMUNITY MODERATION QUEUE</h1>
            </div>
            <span className="font-mono text-xs text-gray">{pending.length} PENDING SUBMISSIONS</span>
          </div>

          {pending.length > 0 ? (
            <div className="space-y-4">
              {pending.map(sub => (
                <div key={sub.id} className="bg-white border border-border-light p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                  <div>
                    <span className="text-[10px] font-mono text-crimson font-bold uppercase">{sub.genre_tags.join(' • ')}</span>
                    <h3 className="text-xl font-bold text-black mt-1">{sub.title}</h3>
                    <p className="text-xs text-gray">{sub.venue_name}, {sub.city} • Org: {sub.organizer_name}</p>
                    <p className="text-xs text-gray mt-2 italic">"{sub.description}"</p>
                  </div>
                  <div className="flex space-x-2">
                    <button 
                      onClick={() => handleApprove(sub)}
                      className="bg-black hover:bg-crimson text-white px-4 py-2 text-xs font-semibold tracking-wider uppercase transition">
                      ✓ PUBLISH
                    </button>
                    <button 
                      onClick={() => handleReject(sub.id)}
                      className="border border-border-light hover:border-black text-gray hover:text-black px-4 py-2 text-xs uppercase transition">
                      ✕ REJECT
                    </button>
                  </div>
                </div>
              ))}
            </div>
          ) : (
            <div className="p-12 text-center border border-border-light bg-white text-xs text-gray">
              Moderation queue clear. No community events awaiting review.
            </div>
          )}
        </div>
      );
    }
